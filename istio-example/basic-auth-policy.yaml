apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: basic-auth-policy
  namespace: longhorn-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: longhorn-dashboard-gateway
  action: CUSTOM
  provider:
    name: basic-auth
  rules:
    - to:
        - operation:
            paths: ["/*"]