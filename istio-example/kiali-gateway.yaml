---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali-gateway-options
  namespace: istio-system
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 2

  deployment: |
    metadata:
      annotations:
        app: kiali
    spec:
      replicas: 2
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: Exists
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: Exists
                topologyKey: kubernetes.io/hostname
          tolerations:
            - effect: NoSchedule
              key: app/istio-reserved
              operator: Exists

  service: |
    spec:
      ports:
      - name: http
        port: 80
        nodePort: 31580
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kiali-gateway
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: "NodePort"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: kiali-gateway-options
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali
  namespace: istio-system
spec:
  parentRefs:
  - name: kiali-gateway
  rules:     
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kiali
      port: 20001
