apiVersion: v1
kind: ConfigMap
metadata:
  name: basic-auth-config
  namespace: istio-system
data:
  htpasswd: |
    admin:$apr1$sY9Wcswu$h/SuQpOrSLFrDWybpu6JO/
    dev:$apr1$56DUogfu$8FiWcitfp2EWL9v51tVlP0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-auth-service
  namespace: istio-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: basic-auth-service
  template:
    metadata:
      labels:
        app: basic-auth-service
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: htpasswd
              mountPath: /etc/nginx/auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx-auth-config
        - name: htpasswd
          configMap:
            name: basic-auth-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-auth-config
  namespace: istio-system
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/auth/htpasswd;

        # Return 200 on successful auth
        # The request headers will be forwarded back to Istio
        proxy_pass http://127.0.0.1:8081;
      }
    }
    server {
      listen 8081;
      location / {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: basic-auth-service
  namespace: istio-system
spec:
  selector:
    app: basic-auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080