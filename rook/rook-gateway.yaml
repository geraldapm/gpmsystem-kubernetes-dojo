---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rook-gateway-options
  namespace: rook-ceph
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 2

  deployment: |
    metadata:
      annotations:
        app: rook
    spec:
      replicas: 2
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: Exists
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: Exists
                topologyKey: kubernetes.io/hostname

  service: |
    spec:
      ports:
      - name: http
        port: 80
        nodePort: 31380
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rook-gateway
  namespace: rook-ceph
  annotations:
    networking.istio.io/service-type: "NodePort"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: rook-gateway-options
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rook
  namespace: rook-ceph
spec:
  parentRefs:
  - name: rook-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: rook-ceph-mgr-dashboard
      port: 7000
