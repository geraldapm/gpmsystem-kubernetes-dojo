---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-public-options
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: "NodePort"
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 2

  deployment: |
    metadata:
      annotations:
        app: gateway-public
    spec:
      replicas: 2

  service: |
    spec:
      ports:
      - name: http
        port: 80
        nodePort: 31080
      - name: https
        port: 443
        nodePort: 31443

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: gateway-public
  namespace: istio-system
  annotations:
    networking.istio.io/service-type: NodePort
spec:
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-public-options
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
