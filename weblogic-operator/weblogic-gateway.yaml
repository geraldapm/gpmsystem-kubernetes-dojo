---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weblogic-gateway-options
  namespace: weblogic-operator
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 2

  deployment: |
    metadata:
      annotations:
        app: weblogic
    spec:
      replicas: 2
      template:
        spec:
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 1
                preference:
                  matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: Exists
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: node-role.kubernetes.io/gateway
                    operator: Exists
                topologyKey: kubernetes.io/hostname
          tolerations:
            - effect: NoSchedule
              key: app/istio-reserved
              operator: Exists

  service: |
    spec:
      ports:
      - name: http
        port: 80
        nodePort: 31080
      - name: https
        port: 443
        nodePort: 31443
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: weblogic-gateway
  namespace: weblogic-operator
  annotations:
    networking.istio.io/service-type: "NodePort"
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: weblogic-gateway-options
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            app: weblogic
  - name: https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            app: weblogic
