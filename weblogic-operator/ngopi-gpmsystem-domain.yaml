apiVersion: "weblogic.oracle/v1"
kind: Cluster
metadata:
  name: ngopi-gpmsystem-cluster-1
  namespace: ngopi-gpmsystem-ns
  labels:
    weblogic.domainUID: ngopi-gpmsystem
spec:
  replicas: 2
  clusterName: cluster-1

---

apiVersion: "weblogic.oracle/v9"
kind: Domain
metadata:
  name: ngopi-gpmsystem
  namespace: ngopi-gpmsystem-ns
  labels:
    weblogic.domainUID: ngopi-gpmsystem

spec:
  configuration:
    model:
      auxiliaryImages:
      - image: "docker.io/geraldapm/weblogic-quick-start-aux-image:v1"
      runtimeEncryptionSecret: ngopi-gpmsystem-runtime-encryption-secret

  domainHomeSourceType: FromModel

  domainHome: /u01/domains/ngopi-gpmsystem
  image: "container-registry.oracle.com/middleware/weblogic:14.1.2.0-generic-jdk17-ol8"

  imagePullPolicy: "IfNotPresent"
  imagePullSecrets:
  - name: weblogic-repo-credentials

  webLogicCredentialsSecret:
    name: ngopi-gpmsystem-weblogic-credentials

  includeServerOutInPodLog: true
  serverStartPolicy: IfNeeded

  serverPod:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: Exists
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: Exists
          topologyKey: kubernetes.io/hostname
    env:
    - name: JAVA_OPTIONS
      value: "-Dweblogic.StdoutDebugEnabled=false"
    - name: USER_MEM_ARGS
      value: "-Djava.security.egd=file:/dev/./urandom -Xms256m -Xmx512m "
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
  replicas: 1
  clusters:
  - name: ngopi-gpmsystem-cluster-1
  restartVersion: '1'
  introspectVersion: '1'

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ngopi-gpmsystem
  namespace: ngopi-gpmsystem-ns
  labels:
    weblogic.domainUID: ngopi-gpmsystem
spec:
  parentRefs:
  - name: weblogic-gateway
    namespace: weblogic-operator
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /console
    backendRefs:
    - name: ngopi-gpmsystem-admin-server
      port: 7001
  - matches:
    - path:
        type: PathPrefix
        value: /quickstart
    backendRefs:
    - name: ngopi-gpmsystem-cluster-1
      port: 8001

